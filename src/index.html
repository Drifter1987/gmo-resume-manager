<!doctype html>
<html lang="en" data-theme="dark" data-font="sans" data-density="comfortable">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07110d" />
  <title>GMO Résumé Manager — resume &amp; experience tracker</title>
  <meta name="description" content="Track your roles, achievements and skills, and export the resume as PDF, DOCX, PNG, TXT, Markdown or JSON." />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="bg-canvas" class="bg-canvas" aria-hidden="true"></canvas>
  <div class="bg-veil" aria-hidden="true"></div>

  <a class="skip-link" href="#editor-panel">Skip to the editor</a>

  <main class="app">
    <section class="editor" id="editor" aria-label="Resume editor">
      <div class="panel" id="editor-panel" role="region" aria-label="Resume fields" tabindex="-1"></div>
    </section>

    <section class="preview" aria-label="Resume preview">
      <div class="preview-head">
        <span class="preview-title">
          <span class="live-dot" aria-hidden="true"></span>
          Live preview
        </span>
        <div class="preview-tools">
          <div class="region-picker">
            <button class="region-btn" type="button" id="region-btn" aria-haspopup="dialog" aria-expanded="false"
              title="Hiring region: sets the screening rules and the AI prompt">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.6" />
                <path d="M3.6 12h16.8M12 3.6c2.6 2.3 3.9 5.3 3.9 8.4s-1.3 6.1-3.9 8.4c-2.6-2.3-3.9-5.3-3.9-8.4S9.4 5.9 12 3.6z"
                  fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              </svg>
              <span id="region-label">EMEA</span>
              <span class="region-badge" id="region-badge" hidden></span>
              <svg class="region-caret" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
            <div class="region-menu" id="region-menu" role="dialog" aria-label="Hiring region" hidden></div>
          </div>
          <span class="flag-tally" id="flag-tally" role="status" aria-live="polite"></span>
          <label class="switch-toggle" title="Highlight every field that breaks a resume rule">
            <input type="checkbox" id="regulations-toggle" />
            <span class="switch-track" aria-hidden="true"></span>
            <span class="switch-text">Highlight issues</span>
          </label>
        </div>
      </div>
      <article class="resume" id="resume"></article>
    </section>
  </main>

  <nav class="dock" id="dock" aria-label="Sections and quick actions">
    <span class="dock-brand" title="GMO Résumé Manager">GMO</span>

    <div class="dock-nav" id="tabs" role="tablist" aria-label="Sections"></div>

    <div class="dock-actions">
      <button class="dock-btn" type="button" data-dock="save" title="Save a snapshot (Ctrl or Cmd + S)">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M6 3.6h12v16.8l-6-4-6 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
        </svg>
        <span>Save</span>
      </button>

      <label class="dock-btn file-trigger" title="Import a resume file">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 3.2v11m0 0 4-4m-4 4-4-4M4.6 17.4v2.2h14.8v-2.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Import</span>
        <input type="file" id="file-input" class="file-input" accept=".json,.md,.markdown,.txt,.pdf,.docx,.png,.zip" />
      </label>

      <button class="dock-btn dock-btn-primary" type="button" data-dock="export" title="Export and share the resume">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 15.4v-11m0 0 4 4m-4-4-4 4M4.6 17.4v2.2h14.8v-2.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Export</span>
      </button>
    </div>

    <div class="dock-meta">
      <span class="dock-status" id="dock-status">Saved on this device</span>
      <span class="dock-build" id="dock-build">v2.8.0 · build dev</span>
    </div>
  </nav>

  <span class="hint-pill" id="saved-hint" role="status" aria-live="polite"></span>

  <script type="module" src="./main.ts"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07110d" />
  <title>GMO Résumé Manager — resume &amp; experience tracker</title>
  <meta name="description" content="Track your roles, achievements and skills, and turn them into a resume." />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <canvas id="bg-canvas" class="bg-canvas" aria-hidden="true"></canvas>
  <div class="bg-veil" aria-hidden="true"></div>

  <header class="app-bar">
    <div class="brand">
      <span class="brand-mark">GMO</span>
      <div>
        <h1>Résumé Manager</h1>
        <p class="brand-sub">Resume &amp; experience tracker</p>
      </div>
    </div>
    <div class="app-actions">
      <button class="btn" id="btn-example" type="button">Example data</button>
      <button class="btn" id="btn-export" type="button">Export JSON</button>
      <button class="btn" id="btn-import" type="button">Import</button>
      <button class="btn" id="btn-markdown" type="button">Markdown</button>
      <button class="btn btn-primary" id="btn-print" type="button">Print / PDF</button>
      <input type="file" id="file-input" accept=".json,application/json" hidden />
    </div>
  </header>

  <div class="app">
    <aside class="editor">
      <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
      <div class="panel" id="editor-panel"></div>
    </aside>

    <main class="preview-wrap">
      <div class="preview-toolbar">
        <span>Live preview</span>
        <span class="preview-hint" id="saved-hint" role="status" aria-live="polite"></span>
      </div>
      <article class="resume" id="resume"></article>
    </main>
  </div>

  <footer class="app-footer">
    <span class="footer-brand">GMO Résumé Manager</span>
    <span class="footer-meta" id="footer-meta">v2.0.0 · build dev</span>
  </footer>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
